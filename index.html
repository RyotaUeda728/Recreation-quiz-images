<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究室クイズ大会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --bg:#fbf1e3; --bg2:#f6e7d2; --panel:#fffaf2; --line:#e5d3b8;
    --text:#33281c; --dim:#8a7a63;
    --amber:#e08c00; --teal:#0f9d8f; --red:#d94f5c; --green:#2e9e5b;
  }
  *{box-sizing:border-box; margin:0;}
  body{background:var(--bg);}
  .app{
    min-height:100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #ffe3bd 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', system-ui, sans-serif;
    display:flex; flex-direction:column;
  }
  .dotFont{font-family:'DotGothic16', monospace; letter-spacing:.04em;}
  button{font-family:inherit; cursor:pointer;}
  button:disabled{cursor:default; opacity:.55;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  img{display:block;}

  /* ---- topbar ---- */
  .topbar{display:flex; align-items:center; gap:12px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:rgba(255,250,242,.75); flex-wrap:wrap;}
  .tbRole{color:var(--amber); font-size:15px;}
  .tbQ{color:var(--dim); font-size:14px;}
  .tbSpacer{flex:1;}
  .tbSync{color:var(--dim); font-size:12px;}
  .miniBtn{background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:5px 10px; font-size:12.5px;}
  .miniBtn:hover:not(:disabled){border-color:var(--amber);}
  .miniBtn.ghost{background:transparent;}
  .miniBtn.danger{border-color:#e8b8bf; color:var(--red);}
  .stage{flex:1; padding:20px; display:flex; flex-direction:column; align-items:center;}

  /* ---- role select ---- */
  .roleWrap{max-width:860px; margin:0 auto; padding:48px 20px; text-align:center;}
  .roleTitle{display:flex; flex-direction:column; gap:4px; margin-bottom:8px;}
  .roleTitle .dotFont{font-size:44px; color:var(--amber); text-shadow:0 0 24px rgba(224,140,0,.30);}
  .roleTitle span:last-child{font-size:18px; color:var(--dim);}
  .roleHint{color:var(--dim); font-size:13.5px; margin:10px 0 26px;}
  .roleGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
  .roleBtn{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 12px; color:var(--text); display:flex; flex-direction:column; gap:6px;
    align-items:center; transition:transform .12s, border-color .12s;}
  .roleBtn:hover{transform:translateY(-3px); border-color:var(--amber);}
  .roleTag{font-size:26px; color:var(--teal);}
  .roleName{font-weight:700;}
  .roleSub{font-size:11.5px; color:var(--dim);}

  /* ---- shared bits ---- */
  .secTitle{font-size:18px; margin-bottom:14px; text-align:center;}
  .note{color:var(--dim); font-size:12.5px; margin-top:10px;}
  .errText{color:var(--red); font-size:13px; margin-top:8px;}
  .note.center{text-align:center;}
  .chip{background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:3px 12px; font-size:13px;}
  .chipEasy{color:var(--teal); border-color:#9ed4cd;}
  .chipHard{color:var(--red); border-color:#eab6bd;}
  .qMeta{display:flex; gap:8px; margin-bottom:12px;}
  .qMeta.center{justify-content:center;}
  .textInput{background:var(--bg2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:12px 14px; font-size:16px; font-family:inherit; min-width:200px;}
  .textInput.grow{flex:1;}
  .bigBtn{background:var(--amber); color:#fff8ec; border:none; border-radius:10px;
    padding:12px 22px; font-size:15.5px; font-weight:700; box-shadow:0 3px 0 #b06e00;}
  .bigBtn:hover:not(:disabled){filter:brightness(1.06);}
  .bigBtn:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 #b06e00;}

  /* ---- board ---- */
  .board{display:flex; flex-direction:column; gap:8px; width:100%; max-width:900px;}
  .boardRow{display:grid; grid-template-columns:110px repeat(4,1fr); gap:8px;}
  .boardCell{border-radius:10px; min-height:56px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:14px;}
  .boardCell.corner{background:transparent;}
  .boardCell.genre{background:var(--bg2); border:1px solid var(--line); font-weight:700;}
  .boardCell.diff{background:var(--bg2); border:1px solid var(--line); gap:2px;}
  .boardCell.diff.easy{color:var(--teal);}
  .boardCell.diff.hard{color:var(--red);}
  .diffPts{font-size:11px; color:var(--dim);}
  .boardCell.panel{border:1px solid var(--line); background:var(--panel); min-height:72px;}
  .boardCell.panel.active .dotFont{font-size:30px; color:var(--amber);}
  .boardCell.panel.active:not(:disabled):hover{border-color:var(--amber); transform:translateY(-2px); transition:.12s;}
  .boardCell.panel.empty{background:#f3e6d0; border-style:dashed;}
  .boardCell.panel.done{background:#f3e6d0; opacity:.65;}
  .soon{color:#a8977c; font-size:12px;}
  .remainCnt{font-size:11px; color:var(--dim); margin-top:2px;}

  /* ---- host ---- */
  .hostWrap{width:100%; max-width:960px; display:flex; flex-direction:column; gap:18px;}
  .hostCenter{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .setupBox{margin:40px auto 0; max-width:520px; width:100%; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:26px;}
  .setupLabel{display:block; font-size:14px; color:var(--dim); margin-bottom:8px;}
  .setupRow{display:flex; gap:10px; flex-wrap:wrap;}
  .hostQText{font-size:19px; font-weight:700;}
  .hostAnsLabel{font-size:13.5px; color:var(--dim);}
  .hostAnsLabel b{color:var(--amber);}
  .statusRow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:760px;}
  .statusCard{background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px; display:flex; flex-direction:column; gap:4px; align-items:center;}
  .statusCard.isDone{border-color:var(--green);}
  .statusName{font-weight:700; font-size:14px;}
  .statusMark{font-size:14px; color:var(--dim);}
  .isDone .statusMark{color:var(--green);}
  .statusPeek{font-size:12.5px; color:var(--dim); word-break:break-all; text-align:center;}
  .scoreAdjust{display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center;
    background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:10px 14px;}
  .scoreAdjustTitle{font-size:12.5px; color:var(--dim);}
  .scoreAdjustItem{display:flex; gap:6px; align-items:center; font-size:13.5px;}
  .scoreAdjustItem b{color:var(--amber); font-size:16px;}
  .hostFooter{display:flex; justify-content:center; gap:10px; margin-top:4px;}
  .histBox{margin-top:18px; padding-top:14px; border-top:1px dashed var(--line);}
  .histInfo{font-size:13.5px; font-weight:700;}
  .histDone{color:var(--green); font-size:12.5px; margin-top:6px;}

  /* ---- monitor ---- */
  .monWrap{width:100%; display:flex; flex-direction:column; align-items:center; gap:20px;}
  .monWait{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; min-height:60vh; text-align:center; color:var(--dim);}
  .monLogo{font-size:72px; color:var(--amber); text-shadow:0 0 40px rgba(224,140,0,.30);
    animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}
  @media (prefers-reduced-motion: reduce){.monLogo{animation:none}}
  .waitMain{font-size:22px; color:var(--text); font-weight:700;}
  .waitSub{font-size:14px;}
  .monTitle{font-size:clamp(22px,3.2vw,34px); text-align:center;}
  .monQ{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%;}
  .monQ.noImg{gap:3vh; padding-top:4vh;}
  .monQ.noImg .monQText{font-size:clamp(30px,4.5vw,56px); max-width:1400px; line-height:1.4;}
  .monQ.noImg .monChoices{gap:18px; max-width:1250px;}
  .monQ.noImg .monChoice{font-size:clamp(18px,2.4vw,32px); padding:24px 26px;}
  .monQ.noImg .monChoice .choiceLetter{font-size:clamp(22px,2.6vw,34px);}
  .monQ.noImg .monHint{font-size:16px;}
  .monQText{font-size:clamp(22px,3.4vw,36px); text-align:center; font-weight:700;}
  .monHint{color:var(--dim); font-size:13px; margin-top:2px;}
  .imgGrid{display:grid; gap:10px; width:100%; max-width:1000px;
    grid-template-columns:repeat(2,1fr);}
  .imgGrid.n1{grid-template-columns:1fr; max-width:720px;}
  .imgGrid.n3{grid-template-columns:repeat(3,1fr);}
  .imgGrid.n5{grid-template-columns:repeat(3,1fr);}
  .imgGrid img{width:100%; height:100%; max-height:calc(34vh * var(--imgscale,1)); object-fit:cover;
    border-radius:12px; border:1px solid var(--line); background:var(--bg2);}
  .imgGrid.mon{max-width:none;}
  .imgGrid.mon img{max-height:calc((100vh - 250px) / 2 * var(--imgscale,1)); min-height:150px;}
  .imgGrid.mon.n1 img,.imgGrid.mon.n3 img{max-height:calc((100vh - 250px) * var(--imgscale,1));}
  .imgGrid.vstack{display:flex; flex-direction:column; align-items:center; gap:10px; max-width:none;}
  .imgGrid.fitContain{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:18px;}
  .imgGrid.vstack.fitContain{flex-direction:column;}
  .imgGrid.fitContain img{object-fit:contain; width:auto; height:auto; max-width:100%; flex:0 1 auto;}
  .imgGrid.mon.n2 img{max-height:calc((100vh - 260px) * var(--imgscale,1));}
  .imgGrid.ansMon{max-width:none; width:100%; justify-items:center;}
  .imgGrid.ansMon img{width:auto; max-width:100%; object-fit:contain;}
  .imgGrid.ansMon.n1 img{max-height:calc(62vh * var(--imgscale,1));}
  .imgGrid.ansMon.n2 img{max-height:calc(52vh * var(--imgscale,1));}
  .imgGrid.ansMon.n3 img{max-height:calc(42vh * var(--imgscale,1));}
  .imgGrid.ansMon.n4 img{max-height:calc(38vh * var(--imgscale,1));}
  .imgGrid.small{max-width:640px; margin:0 auto; align-self:center;}
  .imgGrid.small.fitContain{max-width:none;}
  .imgGrid.small.fitContain img{max-height:calc(280px * var(--imgscale,1));}
  .imgGrid.small img{max-height:calc(150px * var(--imgscale,1));}

  /* ---- team ---- */
  .teamWrap{width:100%; max-width:1100px; display:flex; flex-direction:column; gap:14px;}
  .teamQText{font-size:20px; font-weight:700;}
  .answerBox{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px;
    display:flex; flex-direction:column; gap:10px;}
  .sentBadge{color:var(--green); font-size:13.5px;}
  .resultBanner{display:flex; align-items:center; justify-content:center; gap:16px;
    border-radius:14px; padding:18px; font-size:18px; font-weight:700;}
  .resultBanner.ok{background:rgba(46,158,91,.10); border:1px solid #a5d8b8; color:var(--green);}
  .resultBanner.ng{background:rgba(217,79,92,.08); border:1px solid #e8b8bf; color:var(--red);}
  .resultMark{font-size:38px;}

  /* ---- choices ---- */
  .choiceList{display:flex; flex-direction:column; gap:8px;}
  .choiceBtn{display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--bg2); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:15px; color:var(--text); font-family:inherit;
    transition:border-color .12s, background .12s;}
  .choiceBtn:hover:not(:disabled){border-color:var(--amber);}
  .choiceBtn.sel{background:#fdeacb; border-color:var(--amber); font-weight:700;}
  .choiceLetter{color:var(--amber); font-size:18px; min-width:22px;}
  .monChoices{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
    width:100%; max-width:1000px;}
  .monChoice{display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:14px 18px;
    font-size:clamp(15px,1.8vw,22px); font-weight:500;}
  .monChoice .choiceLetter{font-size:clamp(18px,2vw,26px);}
  .hostChoices{display:flex; flex-direction:column; gap:4px; align-items:flex-start;
    background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px 14px;}
  .hostChoice{font-size:13.5px; color:var(--dim);}
  .hostChoice.correct{color:var(--green); font-weight:700;}

  .choiceList.imgMode{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .choiceList.imgMode .choiceBtn{flex-direction:column; align-items:center; gap:6px;}
  .choiceImg{max-height:calc(18vh * var(--imgscale,1)); max-width:100%; object-fit:contain; border-radius:8px;}
  .monChoices.imgMode{grid-template-columns:repeat(4,1fr); max-width:none;}
  .monChoice.imgMode{flex-direction:column; gap:8px; padding:10px;}
  .monChoiceImg{max-height:calc(31vh * var(--imgscale,1)); max-width:100%; object-fit:contain; border-radius:8px;}
  .hostChoices.imgMode{flex-direction:row; flex-wrap:wrap; gap:10px;}
  .hostChoiceImg{max-height:70px; vertical-align:middle; border-radius:6px; margin:0 4px;}

  /* ---- matching ---- */
  .matchBoard{width:100%; max-width:900px; display:flex; flex-direction:column;}
  .matchBoard.big{max-width:1400px;}
  .matchRow{display:grid; gap:10px;}
  .matchQuote:disabled,.matchImgCell:disabled{opacity:1;}
  .matchQuote{display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--panel); border:2px solid var(--line); border-radius:10px;
    padding:10px 8px; font-size:14px; color:var(--text); font-family:inherit;}
  .matchBoard.big .matchQuote{font-size:clamp(14px,1.5vw,20px); padding:14px 10px;}
  .matchQuote.sel{background:#fdeacb; border-color:var(--amber);}
  .matchQuote:not(:disabled):hover{border-color:var(--amber);}
  .matchQuoteText{font-weight:700;}
  .matchNum{color:var(--amber); font-size:16px;}
  .matchBoard.big .matchNum{font-size:20px;}
  .matchLines{width:100%; height:64px; display:block;}
  .matchBoard.big .matchLines{height:90px;}
  .matchImgCell{display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:8px;
    font-family:inherit; color:var(--text);}
  .matchImgCell:not(:disabled):hover{border-color:var(--amber);}
  .matchImgCell img{max-width:100%; max-height:calc(15vh * var(--imgscale,1)); object-fit:contain; border-radius:6px;}
  .matchRightText{font-weight:700; font-size:14px;}
  .matchBoard.big .matchRightText{font-size:clamp(14px,1.5vw,20px);}
  .matchBoard.big .matchImgCell img{max-height:calc(24vh * var(--imgscale,1));}

  /* ---- answers / scores ---- */
  .ansGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:980px;}
  .ansGrid.compact{max-width:820px;}
  .ansCard{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:24px 16px; display:flex; flex-direction:column; gap:12px; align-items:center;
    justify-content:center; text-align:center; min-height:20vh;}
  .ansCard.mine{outline:2px solid var(--teal); outline-offset:2px;}
  .ansCard.ok{border-color:#a5d8b8;}
  .ansCard.ng{border-color:#e8b8bf;}
  .ansTeam{font-size:16px; color:var(--dim); font-weight:700;}
  .ansText{font-size:clamp(20px,2.8vw,34px); font-weight:700; word-break:break-all;}
  .ansJudge{font-size:clamp(30px,4vw,52px); line-height:1.1;}
  .okT{color:var(--green);} .ngT{color:var(--red);}
  .scoreStrip{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
    background:var(--bg2); border:1px solid var(--line); border-radius:999px; padding:10px 22px;}
  .scoreItem{display:flex; gap:8px; align-items:baseline; font-size:14px;}
  .scoreNum{color:var(--amber); font-size:22px;}

  /* ---- final ---- */
  .finalWrap{display:flex; flex-direction:column; gap:20px; align-items:center; width:100%;}
  .finalList{display:flex; flex-direction:column; gap:12px; width:100%; max-width:640px;}
  .finalRow{display:flex; align-items:center; gap:16px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:16px 22px;}
  .finalRow.rank1{border-color:var(--amber); box-shadow:0 0 24px rgba(224,140,0,.20);
    transform:scale(1.04);}
  .finalRow.mine{outline:2px solid var(--teal); outline-offset:2px;}
  .finalRank{font-size:24px; color:var(--amber); width:64px;}
  .rank1 .finalRank{font-size:30px;}
  .finalName{flex:1; font-size:18px; font-weight:700;}
  .finalScore{font-size:26px; color:var(--amber);}

  .connErr{background:rgba(217,79,92,.08); border:1px solid #e8b8bf; color:var(--red);
    border-radius:10px; padding:10px 14px; font-size:13px; margin:10px auto; max-width:720px; text-align:center;}
  .verTag{position:fixed; left:10px; bottom:8px; font-size:11px; color:#b39c7e; pointer-events:none; z-index:50;}
  .fsExit{position:fixed; top:10px; right:10px; z-index:60; background:rgba(255,250,242,.5);
    border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px;
    color:var(--dim); opacity:.25; transition:opacity .15s;}
  .fsExit:hover{opacity:1;}
  .fsCtl{position:fixed; top:10px; right:10px; z-index:60; display:flex; gap:6px;}
  .fsCtl .fsExit{position:static;}
  .imgScaleCtl{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--dim);}
  .imgScaleCtl b{color:var(--text); min-width:38px; text-align:center; font-size:12px;}

  @media (max-width:680px){
    .boardRow{grid-template-columns:78px repeat(4,1fr);}
    .statusRow,.ansGrid{grid-template-columns:1fr;}
    .imgGrid{grid-template-columns:repeat(2,1fr);}
  }
</style>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* ============================================================
   研究室クイズ大会アプリ — Firebase版
   役割: A=進行役 / B=モニター / C,D,E=チーム1〜3
   Firebase Realtime Database でリアルタイム同期
   ============================================================ */

const { useState, useEffect, useRef, useCallback } = React;

const APP_VERSION = "1.32.1";

// ---- Firebase 接続設定 ----
const firebaseConfig = {
  apiKey: "AIzaSyD2yKgMYT4l4DIBjH5U6YDg1721kgaaFHQ",
  authDomain: "recreation-quiz.firebaseapp.com",
  databaseURL: "https://recreation-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "recreation-quiz",
  storageBucket: "recreation-quiz.firebasestorage.app",
  messagingSenderId: "1036530318630",
  appId: "1:1036530318630:web:55d414b5eb5f71df8355e7",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const STATE_REF = db.ref("state");
const HISTORY_REF = db.ref("history");
const ansRef = (gameId, qNum, teamId) => db.ref(`answers/${gameId}/${qNum}/${teamId}`);
const ansParentRef = (gameId, qNum) => db.ref(`answers/${gameId}/${qNum}`);

const GENRES = ["アニメ・映画・ゲーム", "CG・一般常識", "東京工科大学", "駅当て"];
const DIFFS = [
  { key: "easy", label: "簡単め", points: 1 },
  { key: "hard", label: "難しめ", points: 2 },
];

const IMG_BASE =
  "https://raw.githubusercontent.com/RyotaUeda728/Recreation-quiz-images/main/";

// ---- 問題データ ----
const eki = (base, n = 4) =>
  Array.from({ length: n }, (_, i) => IMG_BASE + `${base}_${i + 1}.png`);

const LETTERS = ["A", "B", "C", "D", "E", "F", "G", "H"];

const CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];
const MATCH_COLORS = ["#d94f5c", "#3f7fd6", "#c78f00", "#2e9e5b"];

function arraysEqual(a, b) {
  return (
    Array.isArray(a) && Array.isArray(b) &&
    a.length === b.length && a.every((v, i) => v === b[i])
  );
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 画像指定は "URL文字列" と {src, h(高さvh)} の両形式に対応
function imgList(images) {

    },

const TOTAL_Q = Object.values(QUESTIONS).reduce((n, pool) => n + pool.length, 0);

const TEAMS = [
  { id: "team1", role: "C", name: "チーム1" },
  { id: "team2", role: "D", name: "チーム2" },
  { id: "team3", role: "E", name: "チーム3" },
];

// ---- 回答の正規化(表記ゆれ吸収) ----
function normalize(s) {
  if (!s) return "";
  let t = String(s).normalize("NFKC").trim().toLowerCase();
  t = t.replace(/[\s\u3000]/g, "");
  t = t.replace(/[\u30a1-\u30f6]/g, (ch) =>
    String.fromCharCode(ch.charCodeAt(0) - 0x60)
  );
  return t;
}
function judge(answerText, patterns) {
  const a = normalize(answerText);
  if (!a) return false;
  return patterns.some((p) => normalize(p) === a);
}
function fmtPts(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

// ---- Firebase 読み書きヘルパー ----
async function readOnce(ref) {
  try {
    const snap = await ref.get();
    return snap.exists() ? snap.val() : null;
  } catch {
    return null;
  }
}

/* ============================================================ */

function QuizApp() {
  const [role, setRole] = useState(null);
  const [game, setGame] = useState(null);
  const [hostAns, setHostAns] = useState({});
  const [busy, setBusy] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [connErr, setConnErr] = useState(false);
  const [isFs, setIsFs] = useState(false);
  const [imgScale, setImgScale] = useState(1);
  const gameRef = useRef(null);
  gameRef.current = game;

  // ---- 全画面状態の監視 ----
  useEffect(() => {
    const onFsChange = () => setIsFs(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", onFsChange);
    return () => document.removeEventListener("fullscreenchange", onFsChange);
  }, []);

  const toggleFullscreen = useCallback(() => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }, []);

  // ---- ゲーム状態のリアルタイム購読 ----
  useEffect(() => {
    if (!role) return;
    const cb = STATE_REF.on(
      "value",
      (snap) => {
        setGame(snap.exists() ? snap.val() : null);
        setLastSync(new Date());
        setConnErr(false);
      },
      () => setConnErr(true)
    );
    return () => STATE_REF.off("value", cb);
  }, [role]);

  // ---- 進行役: 回答受付中はチーム回答をリアルタイム購読 ----
  const qWatchKey =
    role === "A" && game && game.phase === "question"
      ? `${game.gameId}/${game.qNum}`
      : null;
  useEffect(() => {
    if (!qWatchKey) {
      setHostAns({});
      return;
    }
    const [gid, qn] = qWatchKey.split("/");
    const ref = ansParentRef(gid, qn);
    const cb = ref.on("value", (snap) => {
      setHostAns(snap.exists() ? snap.val() : {});
    });
    return () => ref.off("value", cb);
  }, [qWatchKey]);

  // 手動更新(保険): 状態を読み直す
  const refresh = useCallback(async () => {
    const g = await readOnce(STATE_REF);
    if (g) setGame(g);
    setLastSync(new Date());
  }, []);

  const writeGame = async (next) => {
    setBusy(true);
    try {
      await STATE_REF.set({ ...next, updatedAt: Date.now() });
      setBusy(false);
      return true;
    } catch {
      setBusy(false);
      setConnErr(true);
      return false;
    }
  };

  /* ---------- 進行役の操作 ---------- */

  const startGame = async (totalStr) => {
    const n = parseInt(String(totalStr).trim(), 10);
    if (!Number.isInteger(n) || n < 1 || n > 50) {
      return false;
    }
    return await writeGame({
      gameId: Date.now(),
      phase: "select",
      totalQuestions: n,
      qNum: 1,
      usedIds: {},
      current: null,
      answers: null,
      judgments: null,
      scores: { team1: 0, team2: 0, team3: 0 },
    });
  };

  const pickPanel = async (genre, diffKey) => {
    const g = gameRef.current;
    const catKey = `${genre}|${diffKey}`;
    const pool = QUESTIONS[catKey] || [];
    const used = (g.usedIds && g.usedIds[catKey]) || {};
    const remaining = pool.filter((q) => !used[q.id]);
    if (remaining.length === 0) return; // 準備中 or 出題し尽くしたパネルは無反応
    // 過去ゲームで出題済みでない問題を優先(全て出題済みならその中から)
    const hist = (await readOnce(HISTORY_REF)) || {};
    const fresh = remaining.filter((q) => !hist[q.id]);
    const cands = fresh.length > 0 ? fresh : remaining;
    const q = cands[Math.floor(Math.random() * cands.length)];
    db.ref("history/" + q.id).set(true).catch(() => {});
    const diff = DIFFS.find((d) => d.key === diffKey);
    // 画像選択肢: 固定枠以外にプール画像をランダム配置(全画面共通にするためここで確定)
    let choiceImages = null;
    if (q.choiceImagePool) {
      choiceImages = new Array(q.choices.length).fill(null);
      if (q.choiceImageFixed) {
        for (const [idx, url] of Object.entries(q.choiceImageFixed)) {
          choiceImages[Number(idx)] = url;
        }
      }
      const pool = shuffleArr(q.choiceImagePool);
      for (let i = 0; i < choiceImages.length; i++) {
        if (choiceImages[i] === null) choiceImages[i] = pool.shift() || null;
      }
    }
    await writeGame({
      ...g,
      phase: "question",
      current: {
        ...q,
        genre,
        diffKey,
        diffLabel: diff.label,
        points: diff.points,
        choiceImages,
      },
      answers: null,
      judgments: null,
      usedIds: {
        ...(g.usedIds || {}),
        [catKey]: { ...used, [q.id]: true },
      },
    });
  };

  const revealAnswers = async () => {
    const g = gameRef.current;
    const all = (await readOnce(ansParentRef(g.gameId, g.qNum))) || {};
    const answers = {};
    const judgments = {};
    for (const t of TEAMS) {
      const a = all[t.id];
      answers[t.id] = a ? a.text : null;
      let ok = false;
      if (a) {
        if (g.current.type === "choice") {
          ok = a.choiceIndex === g.current.correctIndex;
        } else if (g.current.type === "match") {
          ok = arraysEqual(a.matches, g.current.correctMatches);
        } else {
          ok = judge(a.text, g.current.patterns);
        }
      }
      judgments[t.id] = { correct: ok, points: ok ? g.current.points : 0 };
    }
    await writeGame({ ...g, phase: "reveal", answers, judgments });
  };

  const showJudgment = async () => {
    const g = gameRef.current;
    if (g.phase !== "reveal") return; // 二重加点ガード
    const scores = { ...g.scores };
    for (const t of TEAMS) scores[t.id] += g.judgments[t.id].points;
    await writeGame({ ...g, phase: "judge", scores });
  };

  const nextStep = async () => {
    const g = gameRef.current;
    if (g.qNum >= g.totalQuestions) {
      await writeGame({ ...g, phase: "final" });
    } else {
      await writeGame({
        ...g,
        phase: "select",
        qNum: g.qNum + 1,
        current: null,
        answers: null,
        judgments: null,
      });
    }
  };

  const adjustScore = async (teamId, delta) => {
    const g = gameRef.current;
    const scores = { ...g.scores, [teamId]: g.scores[teamId] + delta };
    await writeGame({ ...g, scores });
  };

  const resetGame = async () => {
    await writeGame({ gameId: Date.now(), phase: "setup" });
  };

  // 設定画面表示中は出題履歴の件数を取得
  const [histCount, setHistCount] = useState(null);
  const inSetup = role === "A" && (!game || game.phase === "setup");
  useEffect(() => {
    if (!inSetup) return;
    let alive = true;
    (async () => {
      const h = (await readOnce(HISTORY_REF)) || {};
      if (alive) setHistCount(Object.keys(h).length);
    })();
    return () => { alive = false; };
  }, [inSetup]);

  const resetHistory = async () => {
    try {
      await HISTORY_REF.set(null);
      setHistCount(0);
    } catch {}
  };

  /* ---------- 画面 ---------- */

  if (!role) return <RoleSelect onPick={setRole} />;

  const phase = game ? game.phase : "setup";

  return (
    <div className="app" style={{ "--imgscale": imgScale }}>
      {!(isFs && role === "B") && (
        <TopBar
          role={role}
          game={game}
          lastSync={lastSync}
          onRefresh={refresh}
          onLeave={() => setRole(null)}
          onFullscreen={role === "B" ? toggleFullscreen : null}
          isFs={isFs}
          imgScale={imgScale}
          setImgScale={setImgScale}
        />
      )}
      {isFs && role === "B" && (
        <div className="fsCtl">
          <button
            className="fsExit"
            onClick={() => setImgScale(Math.max(0.5, Math.round((imgScale - 0.1) * 10) / 10))}
          >
            画像−
          </button>
          <button
            className="fsExit"
            onClick={() => setImgScale(Math.min(1.8, Math.round((imgScale + 0.1) * 10) / 10))}
          >
            画像＋
          </button>
          <button className="fsExit" onClick={toggleFullscreen}>
            ✕ 全画面解除（Escでも可）
          </button>
        </div>
      )}
      {connErr && (
        <p className="connErr">
          サーバーに接続できていません。ネット接続を確認して「↻ 更新」を押してください。
        </p>
      )}
      <div className="stage">
        {role === "A" && (
          <HostView
            game={game}
            phase={phase}
            hostAns={hostAns}
            busy={busy}
            histCount={histCount}
            onResetHistory={resetHistory}
            onStart={startGame}
            onPick={pickPanel}
            onReveal={revealAnswers}
            onJudge={showJudgment}
            onNext={nextStep}
            onAdjust={adjustScore}
            onReset={resetGame}
          />
        )}
        {role === "B" && <MonitorView game={game} phase={phase} />}
        {role.startsWith("team") && (
          <TeamView game={game} phase={phase} teamId={role} />
        )}
      </div>
    </div>
  );
}

/* ============ 進行役 (A) ============ */

function HostView(props) {
  const { game, phase } = props;
  return (
    <div className="hostWrap">
      {phase === "setup" && (
        <HostSetup
          onStart={props.onStart}
          busy={props.busy}
          histCount={props.histCount}
          onResetHistory={props.onResetHistory}
        />
      )}
      {phase === "select" && (
        <React.Fragment>
          <h2 className="secTitle">パネルを選択（口頭で相談 → クリック）</h2>
          <PanelBoard onPick={props.onPick} clickable usedIds={game.usedIds} />
        </React.Fragment>
      )}
      {phase === "question" && (
        <HostQuestion game={game} hostAns={props.hostAns} onReveal={props.onReveal} busy={props.busy} />
      )}
      {phase === "reveal" && (
        <div className="hostCenter">
          <AnswerCards game={game} showJudge={false} compact />
          <button className="bigBtn" disabled={props.busy} onClick={props.onJudge}>
            正誤と得点を発表する
          </button>
        </div>
      )}
      {phase === "judge" && (
        <div className="hostCenter">
          <AnswerCards game={game} showJudge compact />
          <button className="bigBtn" disabled={props.busy} onClick={props.onNext}>
            {game.qNum >= game.totalQuestions ? "最終結果を表示する" : "次の問題選択へ進む"}
          </button>
        </div>
      )}
      {phase === "final" && <FinalBoard game={game} compact />}

      {game && phase !== "setup" && (
        <HostScorePanel game={game} onAdjust={props.onAdjust} />
      )}
      <ResetButton onReset={props.onReset} />
    </div>
  );
}

function ResetButton({ onReset }) {
  const [arming, setArming] = useState(false);
  useEffect(() => {
    if (!arming) return;
    const t = setTimeout(() => setArming(false), 5000);
    return () => clearTimeout(t);
  }, [arming]);
  return (
    <div className="hostFooter">
      {arming ? (
        <React.Fragment>
          <button
            className="miniBtn danger"
            onClick={() => {
              setArming(false);
              onReset();
            }}
          >
            本当にリセットする（最初の設定画面に戻ります）
          </button>
          <button className="miniBtn ghost" onClick={() => setArming(false)}>
            キャンセル
          </button>
        </React.Fragment>
      ) : (
        <button className="miniBtn danger" onClick={() => setArming(true)}>
          ゲームをリセット
        </button>
      )}
    </div>
  );
}

function HostSetup({ onStart, busy, histCount, onResetHistory }) {
  const [v, setV] = useState("10");
  const [err, setErr] = useState("");
  const [histArming, setHistArming] = useState(false);
  const [histMsg, setHistMsg] = useState("");
  const go = async () => {
    const ok = await onStart(v);
    setErr(ok ? "" : "問題数は 1〜50 の半角数字で入力してください");
  };
  useEffect(() => {
    if (!histArming) return;
    const t = setTimeout(() => setHistArming(false), 5000);
    return () => clearTimeout(t);
  }, [histArming]);
  return (
    <div className="setupBox">
      <h2 className="secTitle">ゲーム設定</h2>
      <label className="setupLabel">クイズをやる回数（半角数字で入力）</label>
      <div className="setupRow">
        <input
          className="textInput"
          value={v}
          onChange={(e) => setV(e.target.value)}
          placeholder="最大50まで"
          onKeyDown={(e) => e.key === "Enter" && !e.nativeEvent.isComposing && go()}
        />
        <button className="bigBtn" disabled={busy} onClick={go}>
          この回数でゲーム開始
        </button>
      </div>
      {err && <p className="errText">{err}</p>}
      <p className="note">
        開始すると、モニター(B)と各チーム(C/D/E)の画面が自動で切り替わります。
      </p>
      <div className="histBox">
        <p className="histInfo">
          出題履歴: {histCount === null ? "読み込み中…" : `${histCount} / ${TOTAL_Q} 問が出題済み`}
        </p>
        <p className="note">
          過去のゲームで出た問題は、次のゲームでは後回しになります（未出題の問題が優先で出ます）。
          全問出し終えたジャンルは、また全問からランダムに出ます。
        </p>
        {histArming ? (
          <div className="setupRow">
            <button
              className="miniBtn danger"
              onClick={() => {
                setHistArming(false);
                onResetHistory();
                setHistMsg("出題履歴をリセットしました。全問が未出題の状態です。");
              }}
            >
              本当にリセットする
            </button>
            <button className="miniBtn ghost" onClick={() => setHistArming(false)}>
              キャンセル
            </button>
          </div>
        ) : (
          <button className="miniBtn" onClick={() => { setHistArming(true); setHistMsg(""); }}>
            出題履歴をリセット
          </button>
        )}
        {histMsg && <p className="histDone">{histMsg}</p>}
      </div>
    </div>
  );
}

function HostQuestion({ game, hostAns, onReveal, busy }) {
  const q = game.current;

  return (
    <div className="hostCenter">

        <span className={"chip " + (q.diffKey === "easy" ? "chipEasy" : "chipHard")}>

        </span>

        <div className={"hostChoices" + (q.choiceImages ? " imgMode" : "")}>

      </p>
      <div className="statusRow">

            <div key={t.id} className={"statusCard " + (a ? "isDone" : "")}>
              <span className="statusName">{t.name}</span>

      </div>
      <button className="bigBtn" disabled={busy} onClick={onReveal}>

      </button>
      <p className="note">未回答のチームがいても公開できます（未回答は0点扱い）。</p>
    </div>
  );
}

function HostScorePanel({ game, onAdjust }) {
  return (
    <div className="scoreAdjust">
      <span className="scoreAdjustTitle">得点（手動調整可）</span>
      {TEAMS.map((t) => (
        <span key={t.id} className="scoreAdjustItem">
          {t.name}: <b className="dotFont">{fmtPts(game.scores?.[t.id] ?? 0)}</b>
          <button className="miniBtn" onClick={() => onAdjust(t.id, 0.5)}>+0.5</button>
          <button className="miniBtn" onClick={() => onAdjust(t.id, -0.5)}>-0.5</button>
        </span>
      ))}

      {phase === "judge" && (
        <React.Fragment>
          <h1 className="monTitle">正解は… 「{game.current.answerLabel}」</h1>
          {game.current.type === "match" && (
            <MatchBoard q={game.current} matches={game.current.correctMatches} big />
          )}
          {game.current.answerImages && game.current.answerImages.length > 0 && (
            <div className={"imgGrid ansMon n" + game.current.answerImages.length}>
              {game.current.answerImages.map((src, i) => (
                <img key={i} src={src} alt={"答え画像" + (i + 1)} />
              ))}
            </div>
          )}
          <AnswerCards game={game} showJudge />
          <ScoreStrip game={game} />
        </React.Fragment>
      )}
      {phase === "final" && <FinalBoard game={game} />}
    </div>
  );
}

function MonitorQuestion({ game }) {
  const q = game.current;
  const noImg = (!q.images || q.images.length === 0) && q.type !== "match";
  return (
    <div className={"monQ" + (noImg ? " noImg" : "")}>
      <div className="qMeta center">
        <span className="chip">{q.genre}</span>
        <span className={"chip " + (q.diffKey === "easy" ? "chipEasy" : "chipHard")}>
          {q.diffLabel}・{fmtPts(q.points)}点
        </span>
      </div>
      <h1 className="monQText">{q.text}</h1>
      {q.images && q.images.length > 0 && (
        <div
          className={
            "imgGrid mon n" + q.images.length +
            (q.imageFit === "contain" ? " fitContain" : "") +
            (q.imageLayout === "column" ? " vstack" : "")
          }
          style={
            q.imageWidths && q.imageFit !== "contain"
              ? { gridTemplateColumns: q.imageWidths.map((w) => w + "fr").join(" ") }
              : undefined
          }
        >
          {imgList(q.images).map((e, i) => (
            <img
              key={i}
              src={e.src}
              alt={"ヒント画像" + (i + 1)}
              style={e.h ? { maxHeight: `calc(${e.h}vh * var(--imgscale,1))` } : undefined}
            />
          ))}
        </div>
      )}
      {q.type === "match" && <MatchBoard q={q} matches={null} big />}
      {q.type === "choice" && (
        <div className={"monChoices" + (q.choiceImages ? " imgMode" : "")}>
          {q.choices.map((c, i) => (
            <div key={i} className={"monChoice" + (q.choiceImages ? " imgMode" : "")}>
              <span className="choiceLetter dotFont">{LETTERS[i]}</span>
              {q.choiceImages && q.choiceImages[i] ? (
                <img className="monChoiceImg" src={q.choiceImages[i]} alt={"選択肢" + LETTERS[i]} />
              ) : (
                <span>{c}</span>
              )}
            </div>
          ))}
        </div>
      )}
      <p className="monHint">各チームの画面から回答を入力してください</p>
    </div>
  );
}

/* ============ チーム (C/D/E) ============ */

function TeamView({ game, phase, teamId }) {
  const team = TEAMS.find((t) => t.id === teamId);
  const [text, setText] = useState("");
  const [selIdx, setSelIdx] = useState(null);
  const [sentText, setSentText] = useState(null);
  const [sending, setSending] = useState(false);
  const [sendErr, setSendErr] = useState("");
  const qKeyRef = useRef(null);

  useEffect(() => {
    if (game && phase === "question") {
      const k = `${game.gameId}_${game.qNum}`;
      if (qKeyRef.current !== k) {
        qKeyRef.current = k;
        setText("");
        setSelIdx(null);
        setSentText(null);
        setSendErr("");
      }
    }
  }, [game, phase]);

  const submit = async () => {
    const q = game.current;
    const isChoice = q.type === "choice";
    if (isChoice ? selIdx === null : !text.trim()) return;
    const display = isChoice
      ? q.choices[selIdx]
        ? `${LETTERS[selIdx]}. ${q.choices[selIdx]}`
        : LETTERS[selIdx]
      : text.trim();
    setSending(true);
    try {
      const payload = { text: display, submittedAt: Date.now() };
      if (isChoice) payload.choiceIndex = selIdx;
      await ansRef(game.gameId, game.qNum, teamId).set(payload);
      setSentText(display);
      setSendErr("");
    } catch {
      setSendErr("送信に失敗しました。「回答を送信」をもう一度押してください。");
    }
    setSending(false);
  };

  if (!game || phase === "setup")
    return <WaitScreen main={`${team.name} の画面です`} sub="進行役がゲームを開始するまでお待ちください" />;

  if (phase === "select")
    return (
      <WaitScreen
        main={`第 ${game.qNum} 問`}
        sub="問題を選択中です。モニターを見ながら相談してください"
      />
    );

  if (phase === "question") {
    const q = game.current;
    return (
      <div className="teamWrap">
        <div className="qMeta">
          <span className="chip">{q.genre}</span>
          <span className={"chip " + (q.diffKey === "easy" ? "chipEasy" : "chipHard")}>
            {q.diffLabel}・{fmtPts(q.points)}点
          </span>
        </div>
        <h2 className="teamQText">{q.text}</h2>
        {q.images && q.images.length > 0 && (
          <div
            className={
              "imgGrid small" +
              (q.imageFit === "contain" ? " fitContain" : "") +
              (q.imageLayout === "column" ? " vstack" : "")
            }
            style={
              q.imageWidths && q.imageFit !== "contain"
                ? { gridTemplateColumns: q.imageWidths.map((w) => w + "fr").join(" ") }
                : undefined
            }
          >
            {imgList(q.images).map((e, i) => (
              <img
                key={i}
                src={e.src}
                alt={"ヒント画像" + (i + 1)}
                style={
                  e.hSmall
                    ? { maxHeight: `calc(${e.hSmall}vh * var(--imgscale,1))` }
                    : e.h
                    ? { maxHeight: `calc(${Math.round(e.h * 0.62)}vh * var(--imgscale,1))` }
                    : undefined
                }
              />
            ))}
          </div>
        )}
        {q.type === "match" ? (
          <MatchAnswerBox key={game.gameId + "_" + game.qNum} game={game} teamId={teamId} />
        ) : (
        <div className="answerBox">
          {sendErr && <p className="errText">{sendErr}</p>}
          {sentText && (
            <p className="sentBadge">
              ✓ 回答を送信しました: 「{sentText}」（締め切り前なら修正して再送信できます）
            </p>
          )}
          {q.type === "choice" ? (
            <React.Fragment>
              <div className={"choiceList" + (q.choiceImages ? " imgMode" : "")}>
                {q.choices.map((c, i) => (
                  <button
                    key={i}
                    className={"choiceBtn " + (selIdx === i ? "sel" : "")}
                    onClick={() => setSelIdx(i)}
                  >
                    <span className="choiceLetter dotFont">{LETTERS[i]}</span>
                    {q.choiceImages && q.choiceImages[i] ? (
                      <img className="choiceImg" src={q.choiceImages[i]} alt={"選択肢" + LETTERS[i]} />
                    ) : (
                      <span>{c}</span>
                    )}
                  </button>
                ))}
              </div>
              <button
                className="bigBtn"
                disabled={sending || selIdx === null}
                onClick={submit}
              >
                {sentText ? "修正して再送信" : "この回答を送信"}
              </button>
            </React.Fragment>
          ) : (
            <div className="setupRow">
              <input
                className="textInput grow"
                value={text}
                onChange={(e) => setText(e.target.value)}
                placeholder="回答を入力"
                onKeyDown={(e) => e.key === "Enter" && !e.nativeEvent.isComposing && submit()}
              />
              <button className="bigBtn" disabled={sending || !text.trim()} onClick={submit}>
                {sentText ? "修正して再送信" : "回答を送信"}
              </button>
            </div>
          )}
        </div>
        )}
      </div>
    );
  }

  if (phase === "reveal")
    return (
      <div className="teamWrap">
        <h2 className="secTitle">各チームの回答</h2>
        <AnswerCards game={game} showJudge={false} highlight={teamId} />
        <p className="note center">まもなく正誤発表です</p>
      </div>
    );

  if (phase === "judge") {
    const j = game.judgments[teamId];
    return (
      <div className="teamWrap">
        <div className={"resultBanner " + (j.correct ? "ok" : "ng")}>
          <span className="dotFont resultMark">{j.correct ? "○ 正解！" : "✕ 不正解"}</span>
          <span>{j.correct ? `+${fmtPts(j.points)}点` : "+0点"}</span>
        </div>
        <AnswerCards game={game} showJudge highlight={teamId} />
        <ScoreStrip game={game} />
      </div>
    );
  }

  if (phase === "final") return <FinalBoard game={game} highlight={teamId} />;
  return null;
}

/* ============ マッチング形式 ============ */

// 盤面表示: 上=セリフ群(①〜) 中=接続線 下=画像群(A〜)
function MatchBoard({ q, matches, big, selQuote, onQuote, onImage }) {
  const nL = q.matchLeft.length;
  const rights = q.matchRightImages || q.matchRight;
  const nR = rights.length;
  const cxL = (i) => ((i + 0.5) / nL) * 400;
  const cxR = (i) => ((i + 0.5) / nR) * 400;
  return (
    <div className={"matchBoard " + (big ? "big" : "")}>
      <div className="matchRow" style={{ gridTemplateColumns: `repeat(${nL},1fr)` }}>
        {q.matchLeft.map((t, i) => {
          const pairedImg = matches ? matches.indexOf(i) : -1;
          return (
            <button
              key={i}
              className={
                "matchQuote " +
                (selQuote === i ? "sel " : "") +
                (pairedImg >= 0 ? "paired" : "")
              }
              style={pairedImg >= 0 ? { borderColor: MATCH_COLORS[pairedImg] } : undefined}
              disabled={!onQuote}
              onClick={() => onQuote && onQuote(i)}
            >
              <span className="matchNum dotFont">{CIRCLED[i]}</span>
              <span className="matchQuoteText">{t}</span>
            </button>
          );
        })}
      </div>
      <svg
        className="matchLines"
        viewBox="0 0 400 100"
        preserveAspectRatio="none"
      >
        {matches &&
          matches.map((qi, imgI) =>
            qi === null || qi === undefined ? null : (
              <line
                key={imgI}
                x1={cxL(qi)}
                y1="0"
                x2={cxR(imgI)}
                y2="100"
                stroke={MATCH_COLORS[imgI]}
                strokeWidth="4"
              />
            )
          )}
      </svg>
      <div className="matchRow" style={{ gridTemplateColumns: `repeat(${nR},1fr)` }}>
        {rights.map((src, i) => (
          <button
            key={i}
            className={
              "matchImgCell " +
              (matches && matches[i] !== null && matches[i] !== undefined ? "paired" : "")
            }
            style={
              matches && matches[i] !== null && matches[i] !== undefined
                ? { borderColor: MATCH_COLORS[i] }
                : undefined
            }
            disabled={!onImage}
            onClick={() => onImage && onImage(i)}
          >
            <span className="matchNum dotFont">{LETTERS[i]}</span>
            {q.matchRightImages ? (
              <img src={src} alt={"項目" + LETTERS[i]} />
            ) : (
              <span className="matchRightText">{src}</span>
            )}
          </button>
        ))}
      </div>
    </div>
  );
}

// チームの回答UI: ①を押してからAを押すと線がつながる
function MatchAnswerBox({ game, teamId }) {
  const q = game.current;
  const n = q.matchLeft.length;
  const nR = (q.matchRightImages || q.matchRight).length;
  const [matches, setMatches] = useState(Array(nR).fill(null));
  const [selQuote, setSelQuote] = useState(null);
  const [sentText, setSentText] = useState(null);
  const [sending, setSending] = useState(false);
  const [sendErr, setSendErr] = useState("");

  const onQuote = (i) => setSelQuote(selQuote === i ? null : i);
  const onImage = (imgI) => {
    if (selQuote === null) {
      // セリフ未選択で画像を押したら、その画像の線を外す
      setMatches((m) => m.map((v, idx) => (idx === imgI ? null : v)));
      return;
    }
    setMatches((m) =>
      m.map((v, idx) =>
        idx === imgI ? selQuote : v === selQuote ? null : v
      )
    );
    setSelQuote(null);
  };

  const allDone = matches.every((v) => v !== null);
  const display = matches
    .map((qi, i) => `${LETTERS[i]}→${qi === null ? "?" : CIRCLED[qi]}`)
    .join(" ");

  const submit = async () => {
    if (!allDone) return;
    setSending(true);
    try {
      await ansRef(game.gameId, game.qNum, teamId).set({
        text: display,
        matches,
        submittedAt: Date.now(),
      });
      setSentText(display);
      setSendErr("");
    } catch {
      setSendErr("送信に失敗しました。「回答を送信」をもう一度押してください。");
    }
    setSending(false);
  };

  return (
    <div className="answerBox">
      {sendErr && <p className="errText">{sendErr}</p>}
      {sentText && (
        <p className="sentBadge">
          ✓ 回答を送信しました: {sentText}（締め切り前なら修正して再送信できます）
        </p>
      )}
      <p className="note">
        上の項目(①〜{CIRCLED[n - 1]})を押してから、下の項目(A〜{LETTERS[nR - 1]})を押すと線がつながります。
        下の項目だけを押すとその線を消せます。
      </p>
      <MatchBoard q={q} matches={matches} selQuote={selQuote} onQuote={onQuote} onImage={onImage} />
      <button className="bigBtn" disabled={sending || !allDone} onClick={submit}>
        {sentText ? "修正して再送信" : allDone ? "この組み合わせで送信" : "4つ全てつなげてください"}
      </button>
    </div>
  );
}

function WaitScreen({ main, sub }) {
  return (
    <div className="monWait">
      <div className="monLogo dotFont">QUIZ</div>
      <p className="waitMain">{main}</p>
      <p className="waitSub">{sub}</p>
    </div>
  );
}

/* ============ 共通パーツ ============ */

function PanelBoard({ onPick, clickable, usedIds }) {
  return (
    <div className="board">
      <div className="boardRow head">
        <div className="boardCell corner" />
        {GENRES.map((g) => (
          <div key={g} className="boardCell genre">{g}</div>
        ))}
      </div>
      {DIFFS.map((d) => (
        <div key={d.key} className="boardRow">
          <div className={"boardCell diff " + (d.key === "easy" ? "easy" : "hard")}>
            {d.label}
            <span className="diffPts">{fmtPts(d.points)}点</span>
          </div>
          {GENRES.map((g) => {
            const catKey = `${g}|${d.key}`;
            const pool = QUESTIONS[catKey] || [];
            const total = pool.length;
            const used = (usedIds && usedIds[catKey]) || {};
            const remain = pool.filter((q) => !used[q.id]).length;
            const isEmpty = total === 0;
            const isDone = !isEmpty && remain <= 0;
            const isActive = !isEmpty && !isDone;
            return (
              <button
                key={g}
                className={
                  "boardCell panel " +
                  (isActive ? "active" : isDone ? "done" : "empty")
                }
                disabled={!clickable || !isActive}
                onClick={() => clickable && isActive && onPick(g, d.key)}
              >
                {isEmpty ? (
                  <span className="soon">準備中</span>
                ) : isDone ? (
                  <span className="soon">出題済み</span>
                ) : (
                  <React.Fragment>
                    <span className="dotFont">？</span>
                    <span className="remainCnt">残り{remain}問</span>
                  </React.Fragment>
                )}
              </button>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function AnswerCards({ game, showJudge, highlight, compact }) {
  return (
    <div className={"ansGrid " + (compact ? "compact" : "")}>
      {TEAMS.map((t) => {
        const a = game.answers ? game.answers[t.id] : null;
        const j = game.judgments ? game.judgments[t.id] : null;
        return (
          <div
            key={t.id}
            className={
              "ansCard " +
              (highlight === t.id ? "mine " : "") +
              (showJudge && j ? (j.correct ? "ok" : "ng") : "")
            }
          >
            <div className="ansTeam">{t.name}</div>
            <div className="ansText">{a ? `「${a}」` : "（未回答）"}</div>
            {showJudge && j && (
              <div className={"ansJudge dotFont " + (j.correct ? "okT" : "ngT")}>
                {j.correct ? `○ +${fmtPts(j.points)}点` : "✕ +0点"}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ScoreStrip({ game }) {
  return (
    <div className="scoreStrip">
      {TEAMS.map((t) => (
        <div key={t.id} className="scoreItem">
          <span>{t.name}</span>
          <span className="dotFont scoreNum">{fmtPts(game.scores?.[t.id] ?? 0)}</span>
        </div>
      ))}
    </div>
  );
}

function FinalBoard({ game, highlight, compact }) {
  const ranked = [...TEAMS]
    .map((t) => ({ ...t, score: game.scores?.[t.id] ?? 0 }))
    .sort((a, b) => b.score - a.score);
  let lastScore = null,
    lastRank = 0;
  const rows = ranked.map((t, i) => {
    const rank = t.score === lastScore ? lastRank : i + 1;
    lastScore = t.score;
    lastRank = rank;
    return { ...t, rank };
  });
  return (
    <div className={"finalWrap " + (compact ? "compact" : "")}>
      <h1 className="monTitle">最終結果</h1>
      <div className="finalList">
        {rows.map((t) => (
          <div
            key={t.id}
            className={
              "finalRow rank" + t.rank + (highlight === t.id ? " mine" : "")
            }
          >
            <span className="finalRank dotFont">{t.rank}位</span>
            <span className="finalName">{t.name}</span>
            <span className="finalScore dotFont">{fmtPts(t.score)}点</span>
          </div>
        ))}
      </div>
      <p className="note center">おつかれさまでした！</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <QuizApp />
    <div className="verTag">v{APP_VERSION}</div>
  </React.Fragment>
);
</script>
